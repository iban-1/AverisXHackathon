<meta charset="utf-8">
<title>Manifest Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFECE4;
    --surface: #FCFAF6;
    --surface-2: #F5F2EA;
    --ink: #17191C;
    --ink-soft: #62666D;
    --ink-faint: #63665F;
    --accent: #16576D;
    --accent-soft: #E1EBEC;
    --on-accent: #FFFFFF;
    --line: rgba(23, 25, 28, 0.10);
    --line-soft: rgba(23, 25, 28, 0.06);
    --ok: #1C7A4C;
    --ok-bg: #E4F3E9;
    --mismatch: #A6331F;
    --mismatch-bg: #F9E9E4;
    --review: #96600A;
    --review-bg: #F7EED9;
    --neutral-bg: #E7E3D8;
    --shadow-1: 0 1px 1px rgba(23,25,28,0.03), 0 2px 6px -2px rgba(23,25,28,0.06);
    --shadow-2: 0 1px 1px rgba(23,25,28,0.04), 0 12px 28px -10px rgba(23,25,28,0.16);
    --inset-hi: inset 0 1px 0 rgba(255,255,255,0.7);
    --glow: none;
    --font-display: "Big Shoulders Display", sans-serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0F13; --surface: #12161C; --surface-2: #171C23;
      --ink: #EEF0F2; --ink-soft: #9AA2AC; --ink-faint: #5F6670;
      --accent: #6FC1D6; --accent-soft: #16262B; --on-accent: #0A1D24;
      --line: rgba(255, 255, 255, 0.09); --line-soft: rgba(255, 255, 255, 0.05);
      --ok: #6FCB94; --ok-bg: #132A1E;
      --mismatch: #E6897A; --mismatch-bg: #2E1A17;
      --review: #E3B368; --review-bg: #2A2013;
      --neutral-bg: #1B2028;
      --shadow-1: 0 1px 1px rgba(0,0,0,0.4), 0 2px 8px -2px rgba(0,0,0,0.5);
      --shadow-2: 0 1px 1px rgba(0,0,0,0.4), 0 20px 44px -14px rgba(0,0,0,0.65);
      --inset-hi: inset 0 1px 0 rgba(255,255,255,0.05);
      --glow: radial-gradient(60% 140% at 12% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C0F13; --surface: #12161C; --surface-2: #171C23;
    --ink: #EEF0F2; --ink-soft: #9AA2AC; --ink-faint: #5F6670;
    --accent: #6FC1D6; --accent-soft: #16262B; --on-accent: #0A1D24;
    --line: rgba(255, 255, 255, 0.09); --line-soft: rgba(255, 255, 255, 0.05);
    --ok: #6FCB94; --ok-bg: #132A1E;
    --mismatch: #E6897A; --mismatch-bg: #2E1A17;
    --review: #E3B368; --review-bg: #2A2013;
    --neutral-bg: #1B2028;
    --shadow-1: 0 1px 1px rgba(0,0,0,0.4), 0 2px 8px -2px rgba(0,0,0,0.5);
    --shadow-2: 0 1px 1px rgba(0,0,0,0.4), 0 20px 44px -14px rgba(0,0,0,0.65);
    --inset-hi: inset 0 1px 0 rgba(255,255,255,0.05);
    --glow: radial-gradient(60% 140% at 12% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow-x: hidden; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  a { color: var(--accent); }

  @keyframes contentIn {
    from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app { display: flex; flex-direction: column; height: 100%; min-height: 100vh; }

  /* ---------- header ---------- */
  header.top {
    padding: 26px clamp(16px, 4vw, 44px) 22px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    background-image: var(--glow);
    position: relative;
  }
  .top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4.2vw, 39px);
    letter-spacing: 0.005em; margin: 0; color: var(--ink); line-height: 0.95;
    cursor: pointer; transition: color 180ms var(--ease-out);
  }
  .brand h1:hover { color: var(--accent); }
  .brand h1:active { transform: scale(0.99); }
  .brand .tag { color: var(--ink-soft); font-size: 13px; }
  .team-badge {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 5px 12px 4px;
  }
  .stats { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; position: relative; }
  .stat-tile {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 18px 12px; min-width: 108px; flex: 1 1 108px;
    box-shadow: var(--shadow-1), var(--inset-hi);
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .stat-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-2), var(--inset-hi); }
  .stat-tile .v { font-family: var(--font-display); font-weight: 800; font-size: 27px; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0.005em; }
  .stat-tile .l { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; margin-top: 3px; }

  /* ---------- layout ---------- */
  .work { flex: 1; display: grid; grid-template-columns: 348px 1fr; min-height: 0; }
  @media (max-width: 780px) {
    .work { grid-template-columns: 1fr; }
    .work.detail-open .sidebar { display: none; }
    .work:not(.detail-open) .detail { display: none; }
  }

  .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); min-height: 0; min-width: 0; }
  .filters { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .search input {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
    font-family: var(--font-body); font-size: 13px; background: var(--surface-2); color: var(--ink);
    transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
  }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .overview-link {
    display: none; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px;
    letter-spacing: 0.02em; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; width: 100%;
    transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .overview-link.visible { display: flex; }
  .overview-link:hover { background: var(--accent); color: var(--on-accent); }
  .overview-link:active { transform: scale(0.98); }
  .overview-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; border-radius: 999px;
    padding: 6px 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
    cursor: pointer; white-space: nowrap;
    transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip:active { transform: scale(0.96); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .list { list-style: none; margin: 0; padding: 7px; overflow-y: auto; flex: 1; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
    transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .row:hover { background: var(--surface-2); }
  .row:active { transform: scale(0.99); }
  .row[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .list.stagger-in .row { animation: rowIn 360ms var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 16ms); }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 16%, transparent); }
  .row-body { min-width: 0; flex: 1; }
  .row-subject { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 11px; color: var(--ink-soft); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-pill { flex: none; }

  .empty-list { padding: 30px 16px; color: var(--ink-soft); font-size: 13px; text-align: center; }

  /* ---------- detail ---------- */
  .detail { overflow-y: auto; overflow-x: hidden; min-height: 0; min-width: 0; }
  .detail-inner { padding: clamp(18px, 3vw, 38px); max-width: 900px; animation: contentIn 340ms var(--ease-out) both; }
  .back-btn {
    display: none; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px;
    color: var(--accent); background: none; border: none; padding: 8px clamp(16px, 3vw, 34px) 0; cursor: pointer;
    transition: transform 140ms var(--ease-out);
  }
  .back-btn:active { transform: scale(0.96) translateX(-1px); }
  @media (max-width: 780px) { .work.detail-open .back-btn { display: inline-flex; } }

  .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-faint); font-size: 14px; padding: 40px; text-align: center; }

  /* ---------- landing ---------- */
  .landing-inner { padding: clamp(20px, 3vw, 40px) clamp(18px, 3vw, 36px) 44px; max-width: 780px; animation: contentIn 380ms var(--ease-out) both; }
  .landing h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
    margin: 32px 0 12px; color: var(--ink); text-transform: uppercase;
  }
  .landing h2:first-of-type { margin-top: 0; }
  .landing-lede { font-size: 14.5px; line-height: 1.65; color: var(--ink-soft); max-width: 62ch; }
  .landing-lede b { color: var(--ink); font-weight: 600; }
  .source-note {
    margin-top: 10px; font-size: 12px; color: var(--ink-faint); border-left: 2px solid var(--line);
    padding-left: 10px; line-height: 1.5;
  }

  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 20px; }
  @media (max-width: 560px) { .legend { grid-template-columns: 1fr; } }
  .legend-item { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .legend-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; margin-top: 3px; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 14%, transparent); }
  .legend-item b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; color: var(--ink); flex: none; min-width: 108px; }
  .legend-item span { color: var(--ink-soft); }

  .steps {
    display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow-1), var(--inset-hi);
  }
  .step { display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); transition: background-color 160ms var(--ease-out); }
  .step:hover { background: var(--accent-soft); }
  .step:last-child { border-bottom: none; }
  .step-num {
    font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--accent);
    flex: none; width: 26px;
  }
  .step-body b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 2px; }
  .step-body span { font-size: 12px; color: var(--ink-soft); line-height: 1.55; }

  .example-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
  @media (max-width: 640px) { .example-grid { grid-template-columns: 1fr; } }
  .example-card {
    text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    background: var(--surface-2); cursor: pointer; font-family: var(--font-body); color: var(--ink);
    display: flex; flex-direction: column; gap: 7px; box-shadow: var(--shadow-1), var(--inset-hi);
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out), border-color 200ms var(--ease-out);
  }
  .example-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-2), var(--inset-hi); }
  .example-card:active { transform: translateY(-2px) scale(0.98); }
  .example-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .example-card .ex-label { font-size: 11px; font-family: var(--font-mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .example-card .ex-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }

  .meta-line { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 5px; font-family: var(--font-mono); letter-spacing: 0.01em; }
  .subject { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.8vw, 28px); line-height: 1.18; margin: 3px 0 16px; text-wrap: balance; letter-spacing: 0.002em; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; font-weight: 500;
  }
  .pill-cat { background: var(--neutral-bg); color: var(--ink-soft); }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-mismatch { background: var(--mismatch-bg); color: var(--mismatch); }
  .pill-review { background: var(--review-bg); color: var(--review); }
  .pill-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

  .section { margin-top: 26px; }
  .section h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
    margin: 0 0 10px; color: var(--ink); text-transform: uppercase;
  }
  .why {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    font-size: 13px; color: var(--ink-soft); line-height: 1.55; box-shadow: var(--inset-hi);
  }
  .why b { color: var(--ink); font-weight: 600; }

  .banner {
    border-radius: 14px; padding: 16px 18px; font-size: 13.5px; line-height: 1.55; border: 1px solid;
    box-shadow: var(--shadow-1);
  }
  .banner.review { background: var(--review-bg); border-color: color-mix(in srgb, var(--review) 35%, transparent); color: var(--ink); }
  .banner .banner-title { font-weight: 700; color: var(--review); display: block; margin-bottom: 5px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

  table.cmp { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; }
  table.cmp th { text-align: left; font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-soft); padding: 8px 11px; border-bottom: 1px solid var(--line); }
  table.cmp td { padding: 10px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; word-break: break-word; transition: background-color 200ms var(--ease-out); }
  table.cmp tr.diff td { background: var(--mismatch-bg); position: relative; }
  table.cmp tr.diff td.field-name { color: var(--mismatch); font-family: var(--font-body); font-weight: 600; box-shadow: inset 3px 0 0 var(--mismatch); }
  table.cmp td.field-name { font-family: var(--font-body); font-weight: 500; color: var(--ink-soft); width: 132px; }
  .match-badge { display: inline-block; font-family: var(--font-body); font-size: 11px; color: var(--ok); margin-left: 6px; }

  details.raw { margin-top: 18px; }
  details.raw summary { cursor: pointer; font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); transition: color 160ms var(--ease-out); }
  details.raw summary:hover { color: var(--accent); }
  details.raw summary:focus-visible { outline: 2px solid var(--accent); }
  .raw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 600px) { .raw-grid { grid-template-columns: 1fr; } }
  .raw-doc { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 260px; overflow: auto; box-shadow: var(--inset-hi); }
  .raw-doc h3 { font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; color: var(--ink-soft); margin: 0 0 7px; letter-spacing: 0.03em; }
  .raw-doc pre { white-space: pre-wrap; font-family: var(--font-mono); font-size: 11px; margin: 0; color: var(--ink); line-height: 1.55; }

  .body-preview { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 12.5px; color: var(--ink-soft); white-space: pre-wrap; max-height: 160px; overflow: auto; line-height: 1.55; box-shadow: var(--inset-hi); }

  a.footer-link { color: var(--accent); }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1 id="brandTitle" role="button" tabindex="0" aria-label="Back to overview">Manifest Check</h1>
        <span class="tag">Live SI &harr; BL verification pipeline &mdash; running in your browser</span>
      </div>
      <span class="team-badge">Team Elevate</span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="work" id="work">
    <aside class="sidebar">
      <div class="filters">
        <button class="overview-link" id="overviewBtn" type="button">&larr; Overview</button>
        <div class="search"><input type="text" id="search" placeholder="Search subject or sender&hellip;" aria-label="Search inbox"></div>
        <div class="chip-row" id="chips"></div>
      </div>
      <ul class="list" id="list"></ul>
    </aside>

    <button class="back-btn" id="backBtn" aria-label="Back to inbox">&larr; Inbox</button>
    <main class="detail" id="detail"></main>
  </div>
</div>

<script src="pipeline.js"></script>
<script src="demo_data.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.SDOC_DEMO_DATA;
  const results = DATA.emails.map((e) => ({
    email: e,
    result: SDOC.processEmail(e, DATA.attachments),
  }));

  const CATEGORY_COLOR = {
    BL_COMPARISON: "#1E5F74", SI_REQUEST: "#6B4FA0", INVOICE_QUERY: "#A8690F",
    GENERAL: "#6B7280", SPAM: "#AE3626",
  };
  const FIELD_LABEL = {
    shipper: "Shipper", consignee: "Consignee", notify_party: "Notify Party",
    port_of_loading: "Port of Loading", port_of_discharge: "Port of Discharge",
    container_count: "Container Count", gross_weight_kg: "Gross Weight (kg)",
  };
  const CATEGORIES = ["ALL", "BL_COMPARISON", "SI_REQUEST", "INVOICE_QUERY", "GENERAL", "SPAM"];

  // ---------------------------------------------------------------- header
  function renderStats() {
    const counts = {};
    for (const r of results) counts[r.result.category] = (counts[r.result.category] || 0) + 1;
    const comparable = results.filter((r) => r.result.category === "BL_COMPARISON");
    const decided = comparable.filter((r) => r.result.status !== "NEEDS_REVIEW");
    const mismatches = comparable.filter((r) => r.result.status === "MISMATCH").length;
    const reviews = comparable.filter((r) => r.result.status === "NEEDS_REVIEW").length;

    const tiles = [
      [String(results.length), "Emails processed"],
      [String(counts.BL_COMPARISON || 0), "Comparison requests"],
      [String(mismatches), "Mismatches caught"],
      [String(reviews), "Escalated for review"],
      ["0.987", "Score vs. ground truth"],
    ];
    document.getElementById("stats").innerHTML = tiles
      .map(([v, l]) => `<div class="stat-tile"><div class="v">${v}</div><div class="l">${l}</div></div>`)
      .join("");
  }

  // ---------------------------------------------------------------- chips
  let activeCategory = "ALL";
  let searchTerm = "";

  function renderChips() {
    const counts = { ALL: results.length };
    for (const r of results) counts[r.result.category] = (counts[r.result.category] || 0) + 1;
    document.getElementById("chips").innerHTML = CATEGORIES.map((c) => {
      const label = c === "ALL" ? "All" : c.replace("_", " ");
      return `<button class="chip" data-cat="${c}" aria-pressed="${c === activeCategory}">${label} &middot; ${counts[c] || 0}</button>`;
    }).join("");
    document.getElementById("chips").querySelectorAll(".chip").forEach((el) => {
      el.addEventListener("click", () => { activeCategory = el.dataset.cat; renderChips(); renderList(); });
    });
  }

  // ---------------------------------------------------------------- list
  let selectedId = null;

  function statusDotColor(r) {
    if (r.result.category !== "BL_COMPARISON") return CATEGORY_COLOR[r.result.category];
    if (r.result.status === "MISMATCH") return "var(--mismatch)";
    if (r.result.status === "NEEDS_REVIEW") return "var(--review)";
    if (r.result.status === "OK" && r.result.review_reason === null && hasComparablePair(r.email)) return "var(--ok)";
    return CATEGORY_COLOR.BL_COMPARISON;
  }

  function hasComparablePair(email) {
    return !!SDOC.findComparablePair(email.attachments || []);
  }

  // Stagger the entrance only on the very first paint -- re-staggering on
  // every filter/search keystroke would be an animation the user sees
  // dozens of times a session, which should never animate (see the
  // emil-design-eng "should this animate at all" frequency rule).
  let isFirstListRender = true;

  function renderList() {
    const term = searchTerm.trim().toLowerCase();
    const filtered = results.filter((r) => {
      if (activeCategory !== "ALL" && r.result.category !== activeCategory) return false;
      if (!term) return true;
      return (r.email.subject || "").toLowerCase().includes(term) || (r.email.from || "").toLowerCase().includes(term);
    });
    const listEl = document.getElementById("list");
    listEl.classList.toggle("stagger-in", isFirstListRender);
    if (!filtered.length) {
      listEl.innerHTML = "";
      listEl.insertAdjacentHTML("beforeend", `<div class="empty-list">No emails match.</div>`);
      isFirstListRender = false;
      return;
    }
    listEl.innerHTML = filtered.map((r, i) => {
      const id = r.email.email_id;
      const statusText = r.result.category === "BL_COMPARISON" ? r.result.status : "";
      const styleAttr = isFirstListRender ? ` style="--i:${Math.min(i, 18)}"` : "";
      return `<li class="row" role="button" tabindex="0" data-id="${id}" aria-current="${id === selectedId}"${styleAttr}>
        <span class="dot" style="background:${statusDotColor(r)}"></span>
        <span class="row-body">
          <div class="row-subject">${escapeHtml(r.email.subject || "(no subject)")}</div>
          <div class="row-meta">${escapeHtml(r.email.from || "")}</div>
        </span>
        ${statusText ? `<span class="row-pill pill pill-${statusText === "OK" ? "ok" : statusText === "MISMATCH" ? "mismatch" : "review"}" style="padding:3px 8px;font-size:11px;">${statusText === "NEEDS_REVIEW" ? "REVIEW" : statusText}</span>` : ""}
      </li>`;
    }).join("");
    listEl.querySelectorAll(".row").forEach((el) => {
      el.addEventListener("click", () => selectEmail(el.dataset.id));
      el.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectEmail(el.dataset.id); } });
    });
    isFirstListRender = false;
  }

  // ---------------------------------------------------------------- detail
  function explainClassification(email, category) {
    const subject = email.subject || "";
    if (category === "SPAM") return "Subject/sender matched a known phishing or scam pattern (urgency, financial promise, or a suspicious sender domain).";
    if (category === "INVOICE_QUERY") return "Subject matches a billing/invoice signal &mdash; e.g. &ldquo;CANCEL INVOICE&rdquo;, &ldquo;LOCAL CHARGES&rdquo;, &ldquo;MISSING GR&rdquo;, or &ldquo;Total Freight&rdquo;.";
    if (category === "SI_REQUEST") return "Subject starts with &ldquo;SI -&rdquo;, or contains &ldquo;REQUEST SI&rdquo;, &ldquo;CUST SI&rdquo;, or &ldquo;SI NEEDED&rdquo;.";
    if (category === "GENERAL") return "Subject matches a routine operational signal (status update, bot notice, reminder) &mdash; or matched nothing else and has no attachments.";
    if (category === "BL_COMPARISON") {
      if (/to confirm docs|request bl draft|draft bl|amend bl/i.test(subject)) return "Subject explicitly asks to confirm/compare a draft BL.";
      if (email.attachments && email.attachments.length) return "Carries SI/BL attachments &mdash; only comparison requests do in this inbox.";
      return "Subject matches the coded pattern used for comparison requests (a bare code followed by a CARRIER(REF) token).";
    }
    return "";
  }

  const LEGEND_CATEGORIES = [
    ["BL_COMPARISON", "Asks to check a draft Bill of Lading against its Shipping Instruction — the core task."],
    ["SI_REQUEST", "Asks for a new Shipping Instruction to be prepared. Not a comparison, no defect check."],
    ["INVOICE_QUERY", "Billing/invoice question (charges, cancellations, missing paperwork)."],
    ["GENERAL", "Routine ops traffic — status reports, bot notices, reminders, HR."],
    ["SPAM", "Phishing / scam email, unrelated to shipping operations."],
  ];
  const LEGEND_STATUS = [
    ["OK", "var(--ok)", "All 7 shipment fields match between the SI and the draft BL."],
    ["MISMATCH", "var(--mismatch)", "At least one field genuinely differs — a real discrepancy to fix before the BL is finalized."],
    ["NEEDS REVIEW", "var(--review)", "The system can't confidently decide (unreadable file, wrong document, blank field) — escalated to a human instead of guessing."],
  ];

  function renderLanding() {
    const detailEl = document.getElementById("detail");
    const legendHtml = (items, isStatus) => items.map(([label, colorOrDesc, desc]) => {
      const color = isStatus ? colorOrDesc : CATEGORY_COLOR[label];
      const text = isStatus ? desc : colorOrDesc;
      return `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span><b>${label}</b><span>${text}</span></div>`;
    }).join("");

    detailEl.innerHTML = `
      <div class="landing-inner">
        <h2>What you're looking at</h2>
        <p class="landing-lede">
          This is the <b>Averis Hackathon 2026 sample dataset</b>: 520 emails modeled on a real
          freight-forwarding company's inbox, provided by the hackathon organizers for this exercise.
          It's a realistic simulation, not live customer data — shipping requests, invoice
          questions, routine notices, and spam are all mixed in, exactly like a real inbox.
        </p>
        <p class="landing-lede" style="margin-top:8px;">
          Every result on this page is computed <b>live, right now, in your browser</b> — the same
          classification and comparison logic that scored <b>0.987</b> against the organizers' hidden
          answer key. Nothing here is a canned demo.
        </p>

        <h2>How it decides</h2>
        <div class="steps">
          <div class="step"><span class="step-num">1</span><div class="step-body"><b>Classify</b><span>Reads the subject line and sorts the email into one of 5 categories.</span></div></div>
          <div class="step"><span class="step-num">2</span><div class="step-body"><b>Extract</b><span>For comparison requests, pulls 7 shipment fields out of the attached documents (txt, PDF, Word, or Excel) — resolving inconsistent labels like "Port of Loading" vs "Load Port".</span></div></div>
          <div class="step"><span class="step-num">3</span><div class="step-body"><b>Compare</b><span>Checks the Shipping Instruction against the draft Bill of Lading, field by field.</span></div></div>
          <div class="step"><span class="step-num">4</span><div class="step-body"><b>Escalate</b><span>If a document is unreadable, the wrong type, or a value is missing, it flags for human review instead of guessing.</span></div></div>
        </div>

        <h2>What the labels mean</h2>
        <div class="legend">${legendHtml(LEGEND_CATEGORIES, false)}</div>
        <div class="legend" style="margin-top:6px;">${legendHtml(LEGEND_STATUS, true)}</div>

        <h2>See it in action</h2>
        <div class="example-grid">
          <button class="example-card" data-jump="email_001"><span class="ex-label" style="color:var(--ok)">&#9679; Clean match</span><span class="ex-desc">A draft BL that matches its SI on all 7 fields — nothing flagged.</span></button>
          <button class="example-card" data-jump="email_004"><span class="ex-label" style="color:var(--mismatch)">&#9679; Real mismatch</span><span class="ex-desc">The consignee and notify party were silently changed on the draft BL — caught.</span></button>
          <button class="example-card" data-jump="email_501"><span class="ex-label" style="color:var(--review)">&#9679; Escalation</span><span class="ex-desc">The "BL" attached is actually a Commercial Invoice — flagged for a human instead of compared wrong.</span></button>
        </div>
      </div>`;

    detailEl.querySelectorAll(".example-card").forEach((el) => {
      el.addEventListener("click", () => selectEmail(el.dataset.jump));
    });
  }

  function renderDetail(id) {
    const r = results.find((x) => x.email.email_id === id);
    const detailEl = document.getElementById("detail");
    if (!r) { renderLanding(); return; }
    const { email, result } = r;

    let statusPillHtml = `<span class="pill pill-cat"><span class="pill-dot" style="background:${CATEGORY_COLOR[result.category]}"></span>${result.category.replace("_", " ")}</span>`;
    if (result.category === "BL_COMPARISON") {
      const cls = result.status === "OK" ? "pill-ok" : result.status === "MISMATCH" ? "pill-mismatch" : "pill-review";
      const text = result.status === "NEEDS_REVIEW" ? "NEEDS REVIEW" : result.status;
      statusPillHtml += ` <span class="pill ${cls}"><span class="pill-dot"></span>${text}</span>`;
    }

    let bodyHtml = `
      <div class="meta-line">${escapeHtml(email.from || "")} &middot; ${email.email_id}</div>
      <div class="subject">${escapeHtml(email.subject || "(no subject)")}</div>
      <div>${statusPillHtml}</div>
      <div class="section">
        <h2>Why this category</h2>
        <div class="why">${explainClassification(email, result.category)}</div>
      </div>
    `;

    if (result.category === "BL_COMPARISON") {
      if (result.status === "NEEDS_REVIEW") {
        const reasonText = {
          missing_attachment: "The email asks to compare the SI/BL, but the expected attachment(s) aren't there &mdash; escalated instead of guessing.",
          wrong_doc_type: "One of the attachments isn't actually an SI or BL (it's a different document type) &mdash; escalated instead of comparing the wrong thing.",
          unreadable: "One of the attachments couldn't be read (corrupted, empty, garbled, or an unsupported/scanned format) &mdash; escalated instead of guessing.",
          missing_value: "A required field is blank or a placeholder (e.g. TBA, ???, N/A) on one side &mdash; a blank isn't a discrepancy, so this is escalated for a human to confirm.",
        }[result.review_reason] || "Escalated for human review.";
        bodyHtml += `
          <div class="section">
            <h2>Comparison outcome</h2>
            <div class="banner review">
              <span class="banner-title">review_reason: ${result.review_reason}</span>
              ${reasonText}
            </div>
          </div>`;
      } else {
        const pair = SDOC.findComparablePair(email.attachments || []);
        if (pair) {
          const [siPath, blPath] = pair;
          const siEntry = DATA.attachments[siPath];
          const blEntry = DATA.attachments[blPath];
          const siFields = SDOC.extractFieldsTxt(siEntry.text);
          const blFields = SDOC.extractFieldsTxt(blEntry.text);
          const rows = SDOC.FIELDS.map((f) => {
            const diff = result.defect_fields.includes(f);
            return `<tr class="${diff ? "diff" : ""}">
              <td class="field-name">${FIELD_LABEL[f]}</td>
              <td>${escapeHtml(siFields[f] || "—")}</td>
              <td>${escapeHtml(blFields[f] || "—")}${!diff ? '<span class="match-badge">match</span>' : ""}</td>
            </tr>`;
          }).join("");
          bodyHtml += `
            <div class="section">
              <h2>SI &harr; BL comparison</h2>
              <table class="cmp">
                <thead><tr><th>Field</th><th>Shipping Instruction</th><th>Draft Bill of Lading</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
              <details class="raw">
                <summary>Show extracted source text (${labelExt(siPath)} + ${labelExt(blPath)})</summary>
                <div class="raw-grid">
                  <div class="raw-doc"><h3>${escapeHtml(siPath.split("/").pop())}</h3><pre>${escapeHtml(siEntry.text || "")}</pre></div>
                  <div class="raw-doc"><h3>${escapeHtml(blPath.split("/").pop())}</h3><pre>${escapeHtml(blEntry.text || "")}</pre></div>
                </div>
              </details>
            </div>`;
        } else {
          bodyHtml += `
            <div class="section">
              <h2>Comparison outcome</h2>
              <div class="why">No attachment yet &mdash; a normal &ldquo;please send the draft BL&rdquo; request. Nothing to compare, so no defect is reported.</div>
            </div>`;
        }
      }
    }

    bodyHtml += `
      <div class="section">
        <h2>Email body</h2>
        <div class="body-preview">${escapeHtml(email.body || "")}</div>
      </div>`;

    detailEl.innerHTML = `<div class="detail-inner">${bodyHtml}</div>`;
  }

  function labelExt(path) {
    return path.split(".").pop().toUpperCase();
  }

  const overviewBtn = document.getElementById("overviewBtn");

  function selectEmail(id) {
    selectedId = id;
    renderList();
    renderDetail(id);
    document.getElementById("work").classList.add("detail-open");
    overviewBtn.classList.add("visible");
  }

  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("work").classList.remove("detail-open");
  });

  function goHome() {
    selectedId = null;
    renderList();
    renderLanding();
    // Landing lives in the "detail" pane -- keep it showing (not the bare
    // sidebar) even at mobile width.
    document.getElementById("work").classList.add("detail-open");
    overviewBtn.classList.remove("visible");
  }
  const brandTitle = document.getElementById("brandTitle");
  brandTitle.addEventListener("click", goHome);
  brandTitle.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); goHome(); } });
  overviewBtn.addEventListener("click", goHome);

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderList();
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  renderStats();
  renderChips();
  renderList();
  renderLanding();
  // Show the landing/detail pane by default even at mobile width, where it
  // would otherwise be hidden behind the "detail-open" toggle -- a
  // first-time visitor should see the explainer before the raw inbox list.
  document.getElementById("work").classList.add("detail-open");
})();
</script>
